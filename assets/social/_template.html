<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0}
  .card{width:1280px;height:640px;box-sizing:border-box;padding:90px 100px;
    background:linear-gradient(120deg,#0b3d2e,#0d1117 55%,#1f2a44);
    color:#e6edf3;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;justify-content:center}
  .owner{font-size:30px;color:#2ea043;font-weight:600;letter-spacing:.04em}
  .name{font-size:104px;font-weight:800;margin:10px 0 24px}
  .desc{font-size:40px;color:#c9d1d9;line-height:1.35;max-width:1000px}
  .tech{margin-top:46px;font-size:30px;color:#9fd9bf;letter-spacing:.03em}
</style></head>
<body>
  <div class="card">
    <div class="owner">github.com/fadi-labib</div>
    <div class="name" id="name">REPO</div>
    <div class="desc" id="desc">DESCRIPTION</div>
    <div class="tech" id="tech">TECH</div>
  </div>
</body></html>
