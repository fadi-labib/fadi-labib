<svg
  width="854"
  height="200"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 854 200"
>
  <style>
    .name { font-size: 46px; font-weight: 700; font-family: 'Space Grotesk','Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .desc { font-size: 17px; font-weight: 500; letter-spacing: 0.4px; font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .node { font-size: 10px; font-weight: 600; letter-spacing: 2px; font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }
    .fade { animation: fadeIn 1.2s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/><stop offset="55%" stop-color="#0f1d35"/><stop offset="100%" stop-color="#162a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b7dd8" stop-opacity="0.20"/><stop offset="70%" stop-color="#3b7dd8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#3b7dd8" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="854" height="200" fill="url(#bg)"/>
  <rect width="854" height="200" fill="url(#grid)"/>
  <ellipse cx="427" cy="74" rx="320" ry="72" fill="url(#glow)"/>

  <text x="50%" y="70" text-anchor="middle" class="name fade" style="fill:#ffffff;">Fadi Labib</text>
  <text x="50%" y="104" text-anchor="middle" class="desc fade" style="fill:#dbeafe;">AI Experiments · Software-defined physical systems · Edge-to-cloud</text>

  <!-- edge to cloud telemetry flow -->
  <g>
    <line x1="247" y1="156" x2="607" y2="156" stroke="#3b7dd8" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.4"/>

    <!-- edge node (device / gateway) -->
    <rect x="231" y="148" width="16" height="16" rx="3" fill="#3b7dd8" stroke="#93c5fd" stroke-width="1"/>
    <text x="239" y="182" text-anchor="middle" class="node" style="fill:#6b9be3;">EDGE</text>

    <!-- cloud node with pulsing reception ring -->
    <circle cx="615" cy="156" r="8" fill="#3b7dd8" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="615" cy="156" r="8" fill="none" stroke="#3b7dd8" stroke-width="2">
      <animate attributeName="r" values="8;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="615" y="182" text-anchor="middle" class="node" style="fill:#6b9be3;">CLOUD</text>

    <!-- traveling telemetry packets -->
    <circle r="3.5" cx="247" cy="156" opacity="0" fill="#93c5fd">
      <animate attributeName="cx" values="247;607" dur="5s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="3.5" cx="247" cy="156" opacity="0" fill="#93c5fd">
      <animate attributeName="cx" values="247;607" dur="5s" repeatCount="indefinite" begin="1.67s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" repeatCount="indefinite" begin="1.67s"/>
    </circle>
    <circle r="3.5" cx="247" cy="156" opacity="0" fill="#93c5fd">
      <animate attributeName="cx" values="247;607" dur="5s" repeatCount="indefinite" begin="3.33s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" repeatCount="indefinite" begin="3.33s"/>
    </circle>
  </g>
</svg>
