<svg
  width="854"
  height="200"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 854 200"
>
  <style>
    .name { font-size: 46px; font-weight: 700; font-family: 'Space Grotesk','Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .desc { font-size: 17px; font-weight: 500; letter-spacing: 0.4px; font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .node { font-size: 10px; font-weight: 600; letter-spacing: 2px; font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }
    .fade { animation: fadeIn 1.2s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/><stop offset="55%" stop-color="#0f1d35"/><stop offset="100%" stop-color="#162a4a"/>
    </linearGradient>
    <radialGradient id="nameglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b7dd8" stop-opacity="0.22"/><stop offset="70%" stop-color="#3b7dd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a63"/><stop offset="50%" stop-color="#3b7dd8"/><stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="854" height="200" fill="url(#bg)"/>
  <ellipse cx="427" cy="74" rx="320" ry="74" fill="url(#nameglow)"/>

  <!-- particle field -->
  <g fill="#6b9be3">
    <circle cx="48" cy="34" r="1.6" opacity="0.30"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="112" cy="60" r="1.3" opacity="0.22"/>
    <circle cx="168" cy="28" r="1.5" opacity="0.28"><animate attributeName="opacity" values="0.12;0.4;0.12" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="74" cy="118" r="1.4" opacity="0.20"/>
    <circle cx="138" cy="96" r="1.2" opacity="0.26"><animate attributeName="opacity" values="0.1;0.38;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="86" r="1.5" opacity="0.22"/>
    <circle cx="300" cy="30" r="1.3" opacity="0.24"><animate attributeName="opacity" values="0.1;0.36;0.1" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="26" r="1.4" opacity="0.22"/>
    <circle cx="430" cy="34" r="1.2" opacity="0.20"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="706" cy="32" r="1.6" opacity="0.30"><animate attributeName="opacity" values="0.12;0.46;0.12" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="772" cy="58" r="1.3" opacity="0.22"/>
    <circle cx="822" cy="40" r="1.5" opacity="0.26"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="104" r="1.4" opacity="0.20"/>
    <circle cx="788" cy="100" r="1.2" opacity="0.24"><animate attributeName="opacity" values="0.1;0.36;0.1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="824" cy="120" r="1.5" opacity="0.22"/>
    <circle cx="660" cy="58" r="1.3" opacity="0.26"/>
  </g>

  <text x="50%" y="70" text-anchor="middle" class="name fade" style="fill:#ffffff;">Fadi Labib</text>
  <text x="50%" y="104" text-anchor="middle" class="desc fade" style="fill:#dbeafe;">AI Experiments · Software-defined physical systems · Edge-to-cloud</text>

  <!-- Device -> Edge -> Cloud telemetry flow -->
  <g>
    <!-- thick glowing flow line -->
    <line x1="198" y1="156" x2="656" y2="156" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>

    <!-- device node -->
    <rect x="182" y="148" width="16" height="16" rx="3" fill="#0f1d35" stroke="#3b7dd8" stroke-width="2" filter="url(#glow)"/>
    <text x="190" y="182" text-anchor="middle" class="node" style="fill:#6b9be3;">DEVICE</text>

    <!-- edge node -->
    <circle cx="427" cy="156" r="7" fill="#3b7dd8" stroke="#93c5fd" stroke-width="1.5" filter="url(#glow)"/>
    <text x="427" y="182" text-anchor="middle" class="node" style="fill:#6b9be3;">EDGE</text>

    <!-- cloud node with pulsing reception ring -->
    <circle cx="664" cy="156" r="8" fill="#3b7dd8" stroke="#93c5fd" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="664" cy="156" r="8" fill="none" stroke="#3b7dd8" stroke-width="2">
      <animate attributeName="r" values="8;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="664" y="182" text-anchor="middle" class="node" style="fill:#6b9be3;">CLOUD</text>

    <!-- traveling telemetry packets -->
    <circle r="4" cx="198" cy="156" opacity="0" fill="#bfe0ff" filter="url(#glow)">
      <animate attributeName="cx" values="198;656" dur="5s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="4" cx="198" cy="156" opacity="0" fill="#bfe0ff" filter="url(#glow)">
      <animate attributeName="cx" values="198;656" dur="5s" repeatCount="indefinite" begin="1.67s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" repeatCount="indefinite" begin="1.67s"/>
    </circle>
    <circle r="4" cx="198" cy="156" opacity="0" fill="#bfe0ff" filter="url(#glow)">
      <animate attributeName="cx" values="198;656" dur="5s" repeatCount="indefinite" begin="3.33s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" repeatCount="indefinite" begin="3.33s"/>
    </circle>
  </g>
</svg>
