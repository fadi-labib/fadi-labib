name: Generate 3D Contrib

on:
  schedule:
    - cron: "0 2 * * *"   # nightly, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Clone 3d-contrib generator (pinned to a commit SHA)
        run: |
          git clone --depth 1 --branch v0.9.2 https://github.com/yoshi389111/github-profile-3d-contrib.git gen
          cd gen
          test "$(git rev-parse HEAD)" = "5b718734e8da645411919f0ae9ab9e7f9377158f" \
            || { echo "::error::github-profile-3d-contrib v0.9.2 commit SHA mismatch (tag moved?)"; exit 1; }

      - name: Apply custom renderer (commits-only, brand crop)
        run: cp .github/3d-contrib/create-svg.ts gen/src/create-svg.ts

      - name: Set up Node (with npm cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gen/package-lock.json

      - name: Generate the 3D contribution SVG
        working-directory: gen
        env:
          # Uses a personal access token (read:user) if provided so private
          # contributions are included; falls back to the default token (public only).
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIB_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ${{ github.workspace }}/.github/3d-contrib/settings.json
        run: |
          npm ci
          npm run dev

      - name: Stage SVG for publishing
        run: |
          mkdir -p dist
          cp gen/profile-3d-contrib/profile-customize.svg dist/contrib-3d.svg

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
